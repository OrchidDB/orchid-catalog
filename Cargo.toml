[package]
name = "orchid-catalog"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "Versioned graph catalog, discovery, and execution bindings for OrchidDB"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace", "timeout"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "sqlite", "any"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonschema = { version = "0.33", default-features = false }
url = "2"
base64 = "0.22"
rand = "0.9"
regex = "1"
jsonwebtoken = { version = "11.1", features = ["aws_lc_rs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }


[profile.release]
strip = "symbols"

[profile.dev]
debug = 0
incremental = false
